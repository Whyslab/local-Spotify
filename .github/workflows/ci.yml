name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 3.12 is the oldest supported; 3.14 is what the machine runs (Arch).
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            adder/requirements.txt
            requirements-dev.txt

      # ffmpeg — не для тестов, а для самого сервиса: им проверяются и
      # перекодируются загрузки. Тесты импорта и потоков делают им файлы.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # numpy too: scripts/upgrade_audio.py compares recordings with it, and
      # without it those tests are skipped rather than run.
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt numpy

      # Chromium for tests/test_ui.py, the version this Playwright release drives.
      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: |
          ruff check .
          ruff format --check adder scripts tests desktop

      - name: Type check
        run: mypy

      - name: Compile Python sources
        run: python -m compileall -q adder scripts tests desktop

      - name: Run tests
        env:
          API_TOKEN: ci-test-token
          LIBRARY_PATH: ${{ github.workspace }}/test-library
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
