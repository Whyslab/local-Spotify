# Type checking, run by CI: mypy (from requirements-dev.txt), no arguments.
[mypy]
python_version = 3.12
files = adder, scripts, desktop
warn_unused_ignores = True
warn_redundant_casts = True

# Optional: the desktop window (GTK, D-Bus) and the audio analysis and DJ
# transitions (librosa with scipy and soundfile, numpy) import them only on
# machines that have them; CI installs the analysis set for the transition
# tests, and neither scipy nor soundfile ships types.
[mypy-gi.*,dbus.*,librosa.*,numpy.*,scipy.*,soundfile.*]
ignore_missing_imports = True
