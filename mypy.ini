# Type checking, run by CI: mypy (from requirements-dev.txt), no arguments.
[mypy]
python_version = 3.12
files = adder, scripts, desktop
warn_unused_ignores = True
warn_redundant_casts = True

# Optional, not installed in CI: the desktop window (GTK, D-Bus) and the
# audio analysis (librosa, numpy) import them only on machines that have them.
[mypy-gi.*,dbus.*,librosa.*,numpy.*]
ignore_missing_imports = True
